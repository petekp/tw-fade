name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The verify chain launches Chromium, Firefox, and WebKit.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Run unit tests against the committed dist first, so the
      # "dist === fresh compile" freshness gate stays meaningful
      # (a preceding build would mask a stale committed dist).
      - name: Unit tests
        run: npm test

      - name: Browser verify chain
        # verify-scrollbar stays headed so Chromium paints the bars it samples.
        # The Linux runner has no display, so provide one with Playwright's Xvfb.
        run: xvfb-run -a npm run verify
